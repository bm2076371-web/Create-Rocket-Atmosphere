name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Conferir que os stubs NAO foram empacotados
        run: |
          if unzip -l build/libs/*.jar | grep -E "dev/(propulsionteam|ryanhcode)/"; then
            echo "ERRO: stubs dentro do jar"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: create-rocket-atmosphere-jar
          path: build/libs/*.jar
