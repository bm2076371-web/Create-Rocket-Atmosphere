plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'dev.rocketatmosphere'

base {
    archivesName = 'rocketatmosphere'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: project.version.toString()]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

// As classes em dev/propulsionteam/** e dev/ryanhcode/** sao STUBS de compilacao
// (assinaturas copiadas do bytecode real). NUNCA vao dentro do .jar final.
tasks.named('jar', Jar).configure {
    exclude 'dev/propulsionteam/**'
    exclude 'dev/ryanhcode/**'
}
